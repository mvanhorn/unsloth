# Builds the PyPI wheel from the PR branch, then verifies the built wheel
# actually contains what we expect to ship and does NOT contain the broken
# Unsloth bundle that 2026.5.1 published. This is the single workflow that
# would have blocked the 2026.5.1 release before twine upload.
#
# Verified locally end-to-end against this branch:
#   - python -m build produces unsloth-<version>-py3-none-any.whl in 13s
#   - wheel content sanity passes:
#       lockfile shipped, frontend dist shipped,
#       no node_modules in wheel, no bun.lock in wheel,
#       main bundle has unstable_Provider hits=1 (assistant-ui internals only).
#   - Unsloth backend imports cleanly from the installed wheel with the
#     lightweight dep set below.

name: Wheel CI

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'studio/**'
      - 'unsloth/**'
      - 'unsloth_cli/**'
      - '.github/workflows/wheel-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'studio/**'
      - 'unsloth/**'
      - 'unsloth_cli/**'
      - '.github/workflows/wheel-smoke.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # Latest-only on a PR branch. On main this does less than it reads like: it stops
  # a RUNNING main job being killed, but GitHub cancels any PENDING run in the group
  # the moment a newer one is queued, so a merge burst still leaves only the tip.
  # See studio-backend-ci.yml, which is grouped per commit on main for that reason.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  wheel:
    name: Wheel build + content sanity + import smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Lockfile supply-chain audit (pre-install scan)
        run: python3 scripts/lockfile_supply_chain_audit.py

      - name: Build frontend
        # Lifecycle scripts (esbuild native-binary postinstall, etc.) are
        # required for `vite build`. The pre-install lockfile structural
        # audit (lockfile_supply_chain_audit.py) is the practical defence
        # against the npm postinstall-dropper class -- it fires BEFORE any
        # tarball runs, on the injection pattern itself rather than an
        # advisory-DB lookup.
        run: |
          cd studio/frontend
          npm ci --no-fund --no-audit
          npm run build

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          rm -rf dist build ./*.egg-info
          python -m build

      - name: Wheel content sanity
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          w = glob.glob("dist/unsloth-*.whl")
          if not w:
              print("FAIL: no wheel produced"); sys.exit(2)
          w = w[0]
          print(f"wheel: {w}")
          with zipfile.ZipFile(w) as z:
              n = z.namelist()
              checks = {
                "lockfile shipped":      any(s.endswith("studio/frontend/package-lock.json") for s in n),
                "frontend dist shipped": any(s.endswith("studio/frontend/dist/index.html")    for s in n),
                "no node_modules":       not any("studio/frontend/node_modules/" in s for s in n),
                "no bun.lock":           not any(s.endswith("studio/frontend/bun.lock")       for s in n),
              }
              js = [s for s in n
                    if "studio/frontend/dist/assets/" in s
                    and s.endswith(".js")
                    and "/index-" in s]
              if not js:
                  print("FAIL: no main bundle index-*.js in wheel"); sys.exit(2)
              data = z.read(js[0]).decode("utf-8", "replace")
              hits = data.count("unstable_Provider:")
              print(f"main bundle: {js[0]}")
              print(f"unstable_Provider hits: {hits} (>=4 indicates 2026.5.1 regression)")
              checks["bundle has no Unsloth unstable_Provider call site"] = (hits < 4)

              print()
              for k, v in checks.items():
                  print(f"  [{'PASS' if v else 'FAIL'}] {k}")
              sys.exit(0 if all(checks.values()) else 1)
          PY

      - name: Wheel dependency metadata sanity
        run: |
          python - <<'PY'
          import glob
          import sys
          import zipfile
          from email.parser import BytesParser

          from packaging.markers import default_environment
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name

          wheels = glob.glob("dist/unsloth-*.whl")
          if len(wheels) != 1:
              print(f"FAIL: expected one wheel in dist/, got {wheels}")
              sys.exit(2)

          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata_files = [
                  name for name in wheel.namelist()
                  if name.endswith(".dist-info/METADATA")
              ]
              if len(metadata_files) != 1:
                  print(f"FAIL: expected one .dist-info/METADATA, got {metadata_files}")
                  sys.exit(2)
              metadata = BytesParser().parsebytes(wheel.read(metadata_files[0]))

          project_name = canonicalize_name(metadata["Name"])
          requirements = [
              Requirement(value) for value in metadata.get_all("Requires-Dist", [])
          ]
          windows_314 = default_environment()
          windows_314.update(
              os_name = "nt",
              sys_platform = "win32",
              platform_machine = "AMD64",
              platform_system = "Windows",
              python_version = "3.14",
              python_full_version = "3.14.0",
              implementation_name = "cpython",
              platform_python_implementation = "CPython",
          )

          def applies(requirement, extra, environment):
              if requirement.marker is None:
                  return True
              marker_environment = environment.copy()
              marker_environment["extra"] = extra
              return requirement.marker.evaluate(marker_environment)

          def dependency_closure(root_extra, environment):
              pending = [root_extra]
              visited = set()
              selected = []
              while pending:
                  extra = pending.pop()
                  if extra in visited:
                      continue
                  visited.add(extra)
                  for requirement in requirements:
                      if not applies(requirement, extra, environment):
                          continue
                      if canonicalize_name(requirement.name) == project_name:
                          pending.extend(sorted(requirement.extras))
                      else:
                          selected.append((extra, requirement))
              return visited, selected

          failures = []

          def fail(message):
              failures.append(message)
              print(f"FAIL: {message}")

          expected_xpu_urls = {
              "intel-gpu-torch2110": {
                  "triton-xpu": "https://download.pytorch.org/whl/triton_xpu-3.7.0-cp314-cp314-win_amd64.whl#sha256=c6cc245805e85be3bd0db8672e8f340dac4c5c53cac66d8d6458739c327c91af",
                  "torch": "https://download.pytorch.org/whl/xpu/torch-2.11.0%2Bxpu-cp314-cp314-win_amd64.whl#sha256=3a0b9dc0bc316b8249bf22cc697ccfd221f68879a2c3198909f1a2752d7f6e9f",
                  "torchvision": "https://download.pytorch.org/whl/xpu/torchvision-0.26.0%2Bxpu-cp314-cp314-win_amd64.whl#sha256=a86ef43f90c58babcd84dee92f9fb00e68fa4b39b63c5bcdcb282ac38e7036a2",
              },
              "intel-gpu-torch2120": {
                  "triton-xpu": "https://download.pytorch.org/whl/triton_xpu-3.7.1-cp314-cp314-win_amd64.whl#sha256=ec6b0112d272b5fc28e818c59b839ee8c8054d956b1615e575980d91b1bfa9bf",
                  "torch": "https://download.pytorch.org/whl/xpu/torch-2.12.0%2Bxpu-cp314-cp314-win_amd64.whl#sha256=2327c55e624483159eb9ad1d4cd0198896a3404951aa1e03418f282884d60b87",
                  "torchvision": "https://download.pytorch.org/whl/xpu/torchvision-0.27.0%2Bxpu-cp314-cp314-win_amd64.whl#sha256=7db2bec228cab23ec10c54dbc3a7b8bdbbd92b6e644bf27f6b2954a93babe007",
              },
          }
          excluded_environments = {
              "Python 3.13": dict(windows_314, python_version = "3.13", python_full_version = "3.13.0"),
              "Python 3.14.1": dict(windows_314, python_full_version = "3.14.1"),
              "Linux": dict(windows_314, os_name = "posix", sys_platform = "linux", platform_system = "Linux"),
              "Windows ARM64": dict(windows_314, platform_machine = "ARM64"),
          }

          for root_extra, expected in expected_xpu_urls.items():
              failures_before = len(failures)
              visited, selected = dependency_closure(root_extra, windows_314)
              forbidden = [
                  str(requirement) for _, requirement in selected
                  if canonicalize_name(requirement.name) in {"triton", "triton-windows"}
              ]
              if forbidden:
                  fail(f"{root_extra} reaches generic Triton requirements: {forbidden}")

              for package, expected_url in expected.items():
                  matches = [
                      (extra, requirement) for extra, requirement in selected
                      if canonicalize_name(requirement.name) == package
                  ]
                  if len(matches) != 1:
                      fail(f"{root_extra} must select exactly one {package}, got {matches}")
                      continue
                  origin_extra, requirement = matches[0]
                  if requirement.url != expected_url:
                      fail(
                          f"{root_extra} selected the wrong {package} URL:\n"
                          f"  expected: {expected_url}\n"
                          f"  actual:   {requirement.url}"
                      )
                  if requirement.marker is None:
                      fail(f"{root_extra} {package} cp314 row is unqualified")
                  for label, environment in excluded_environments.items():
                      if applies(requirement, origin_extra, environment):
                          fail(f"{root_extra} {package} cp314 row also applies to {label}")

              print(
                  f"{'PASS' if len(failures) == failures_before else 'CHECK'}: "
                  f"{root_extra} follows {sorted(visited)} "
                  "and selects one cp314 XPU torch/Triton/torchvision set"
              )

          _, triton_selected = dependency_closure("triton", windows_314)
          triton_windows = [
              requirement for _, requirement in triton_selected
              if canonicalize_name(requirement.name) == "triton-windows"
          ]
          if len(triton_windows) != 1:
              fail(f"triton extra must select one triton-windows, got {triton_windows}")
          else:
              print("PASS: triton extra still selects triton-windows on Windows x86-64")

          sys.exit(0 if not failures else 1)
          PY

      - name: No test suites in wheel or sdist
        # tests/security/fixtures embeds a real supply-chain IOC literal, which got
        # the published sdist flagged by antivirus vendors (discussion #9577).
        run: |
          python - <<'PY'
          import glob, sys, tarfile, zipfile

          def is_test(path):
              return "tests" in path.strip("/").split("/")

          def report(label, names):
              offenders = sorted(n for n in names if is_test(n))
              ioc = sorted(n for n in names if "malicious_" in n)
              print(f"{label}: {len(offenders)} test paths, {len(ioc)} IOC fixtures")
              for n in offenders[:20]:
                  print(f"    {n}")
              if len(offenders) > 20:
                  print(f"    ... and {len(offenders) - 20} more")
              for n in ioc:
                  print(f"    IOC {n}")
              return not offenders and not ioc

          ok = True
          wheels = glob.glob("dist/unsloth-*.whl")
          sdists = glob.glob("dist/unsloth-*.tar.gz")
          if not wheels or not sdists:
              print("FAIL: expected one wheel and one sdist in dist/")
              sys.exit(2)
          with zipfile.ZipFile(wheels[0]) as z:
              ok &= report(f"wheel {wheels[0]}", z.namelist())
          with tarfile.open(sdists[0]) as t:
              # Every sdist member carries an "unsloth-<version>/" prefix.
              ok &= report(
                  f"sdist {sdists[0]}",
                  [n.split("/", 1)[1] for n in t.getnames() if "/" in n],
              )
          print("PASS" if ok else "FAIL: test files are being shipped")
          sys.exit(0 if ok else 1)
          PY

      - name: Unsloth backend import smoke
        # Imports `studio.backend.main:app` from the freshly-installed wheel in
        # a clean venv. This catches the class of bug that 2026.5.1 shipped with:
        # frontend dist missing, package-lock.json missing, or the wheel's Python
        # source tree broken in a way that surfaces only at app construction time.
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --upgrade pip
          /tmp/v/bin/pip install -r studio/backend/requirements/studio.txt
          /tmp/v/bin/pip install \
            python-multipart aiofiles sqlalchemy cryptography \
            pyyaml jinja2 mammoth unpdf requests \
            'numpy<3'
          /tmp/v/bin/pip install --no-deps dist/unsloth-*.whl
          # Run from /tmp so Python imports the installed package, not the source tree.
          cd /tmp
          /tmp/v/bin/python -c "from studio.backend.main import app; print('Unsloth backend OK:', app.title)"

      - name: CLI without the Unsloth stack guides instead of tracebacking
        # The smoke above installs studio.txt first, so it cannot catch a wheel
        # that ships studio/ without declaring what it imports (#4701, #5260,
        # #7147). Drop only structlog to reuse that venv without a re-download.
        run: |
          set -eu
          /tmp/v/bin/pip uninstall -y structlog >/dev/null
          cd /tmp
          status=0
          for args in "export ./nope ./out" "list-checkpoints"; do
            echo "--- unsloth $args"
            out=$(/tmp/v/bin/unsloth $args 2>&1 || true)
            printf '%s\n' "$out"
            case "$out" in
              *Traceback*)
                echo "FAIL: raw traceback instead of guidance"; status=1 ;;
            esac
            case "$out" in
              *'unsloth studio update'*) ;;
              *) echo "FAIL: no remediation in the message"; status=1 ;;
            esac
          done
          /tmp/v/bin/pip install -q structlog >/dev/null
          exit "$status"

      - name: Upload wheel on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: unsloth-wheel
          path: dist/
          retention-days: 7
